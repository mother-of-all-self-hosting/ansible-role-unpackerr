---
- name: Include roles for Unpackerr Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # The role mounts the download directory, but does not own it: on a real
    # server it belongs to the download client. It is created here the way an
    # operator would have it, writable by the user Unpackerr runs as.
    - name: Ensure the download directory with its watched folder exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ unpackerr_uid }}"
        group: "{{ unpackerr_gid }}"
      loop:
        - "{{ unpackerr_molecule_downloads_path }}"
        - "{{ unpackerr_molecule_downloads_path }}/{{ unpackerr_molecule_watch_folder }}"

    - name: Include roles for Unpackerr Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure Unpackerr service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure Unpackerr systemd service is started
      ansible.builtin.systemd_service:
        name: unpackerr.service
        state: started
