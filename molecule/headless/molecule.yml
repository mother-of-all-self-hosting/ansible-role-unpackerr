---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  # The name carries both the role and the scenario, so that scenarios running
  # in parallel cannot collide on it.
  - name: unpackerr-${MOLECULE_DISTRO:-ubuntu2604}-headless
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Docker inside the instance stores images via containerd. Its storage
      # cannot use overlay on top of the instance's own overlay filesystem, so a
      # volume puts it on a real filesystem.
      - /var/lib/containerd
    # Remove volumes along with the instance, so that local runs do not leave
    # gigabytes behind.
    keep_volumes: false
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    # Deliberately no published ports. Everything the verification looks at is
    # reached from inside this container.
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        unpackerr_debug_service_enabled: false
        unpackerr_restarts_check_enabled: true

        # The container the role derives from its identifier. Role defaults are
        # not in scope in a verify play, so it is spelled out.
        unpackerr_molecule_container: unpackerr

        # The download directory, as it exists on the host and as it is mounted
        # into the container, and the folder that Unpackerr watches inside it.
        unpackerr_molecule_downloads_path: /srv/downloads
        unpackerr_molecule_downloads_bind_path: /downloads
        unpackerr_molecule_watch_folder: watch

        # The directory the role mounts at /config. It is the role's default,
        # spelled out because role defaults are not in scope in a verify play.
        unpackerr_molecule_data_path: /unpackerr/data

        # Variables for Unpackerr
        unpackerr_uid: 1000
        unpackerr_gid: 1000

        # What an existing installation that does not want the web UI sets, and
        # nothing else: no hostname, with the Traefik labels left at the role's
        # default (enabled), so that installing at all shows the role does not
        # require a hostname for a web UI it does not serve. The port is asked to
        # be published anyway, so that the container publishing nothing is the
        # role leaving it out rather than nobody asking for it.
        unpackerr_webserver_enabled: false
        unpackerr_container_http_host_bind_port: 127.0.0.1:5656

        # The download directory, mounted the way docs/configuring-unpackerr.md
        # describes.
        unpackerr_container_additional_volumes_custom:
          - type: bind
            src: "{{ unpackerr_molecule_downloads_path }}"
            dst: "{{ unpackerr_molecule_downloads_bind_path }}"

        # A watched folder, so that Unpackerr logging that it watches it says it
        # has read its configuration and is at work without a web UI.
        unpackerr_environment_variables_additional_variables: |
          UN_FOLDER_0_PATH={{ unpackerr_molecule_downloads_bind_path }}/{{ unpackerr_molecule_watch_folder }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
