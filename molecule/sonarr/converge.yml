---
- name: Include roles for Unpackerr Sonarr integration Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # Neither role owns the download directory: on a real server it belongs to
    # the download client. It is created here the way an operator would have it,
    # writable by the user both services run as.
    - name: Ensure the download directory exists
      ansible.builtin.file:
        path: "{{ unpackerr_molecule_downloads_path }}"
        state: directory
        mode: "0755"
        owner: "{{ unpackerr_uid }}"
        group: "{{ unpackerr_gid }}"

    - name: Include roles for Unpackerr Sonarr integration Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - ansible-role-sonarr
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure services are started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    # Sonarr is deliberately not started here. Unpackerr's unit wants it (see
    # `unpackerr_systemd_wanted_services_list_auto` in molecule.yml), so
    # starting Unpackerr is what has to bring Sonarr up.
    - name: Ensure Unpackerr systemd service is started
      ansible.builtin.systemd_service:
        name: unpackerr.service
        state: started
