---
- name: Verify Unpackerr serving Sonarr
  hosts: all
  become: true
  gather_facts: false

  vars:
    # The name carries both the role and the scenario, like the platform does, so
    # a leftover container can never be mistaken for another scenario's.
    unpackerr_verify_wrong_key_container: "{{ inventory_hostname }}-wrong-key-control"

    # Same length and alphabet as the real key, so that Sonarr has nothing but
    # its value to turn it away for.
    unpackerr_verify_wrong_api_key: ffffffffffffffffffffffffffffffff

    # A folder placed in the download directory on the host, which both
    # containers are asked about at the same path.
    unpackerr_verify_marker_folder: molecule-same-path-marker

    unpackerr_verify_units:
      - sonarr.service
      - unpackerr.service

  tasks:
    - name: Verify that Unpackerr serves Sonarr
      block:
        # ------------------------------------------------------------------
        # Both units are up, and Sonarr answers only to its API key
        # ------------------------------------------------------------------

        - name: Wait for the systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: unpackerr_services
          until: unpackerr_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ unpackerr_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd units means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the systemd services are active
          ansible.builtin.assert:
            that: unpackerr_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(unpackerr_verify_units | zip(unpackerr_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the systemd services log for debugging
          when: unpackerr_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ unpackerr_verify_units }}"

        - name: Wait for Sonarr to answer with the API key (up to 180s)
          ansible.builtin.uri:
            url: "{{ unpackerr_molecule_sonarr_verify_url }}/api/v3/system/status"
            headers:
              X-Api-Key: "{{ unpackerr_molecule_sonarr_api_key }}"
            status_code: [200]
          register: unpackerr_sonarr_status
          until: unpackerr_sonarr_status.status | default(0) == 200
          retries: 36
          delay: 5

        - name: Ask Sonarr for its queue with the API key
          ansible.builtin.uri:
            url: "{{ unpackerr_molecule_sonarr_verify_url }}/api/v3/queue"
            headers:
              X-Api-Key: "{{ unpackerr_molecule_sonarr_api_key }}"
            status_code: [200]
          register: unpackerr_sonarr_queue

        - name: Ask Sonarr for its queue without credentials
          ansible.builtin.uri:
            url: "{{ unpackerr_molecule_sonarr_verify_url }}/api/v3/queue"
            status_code: [401]
          register: unpackerr_sonarr_anonymous_queue

        # Unpackerr reads exactly this endpoint. Sonarr turning away callers that
        # present no key is what makes Unpackerr reading it evidence that the key
        # the role handed it arrived.
        - name: Assert Sonarr hands out its queue only to its API key
          ansible.builtin.assert:
            that:
              - unpackerr_sonarr_status.json.appName == 'Sonarr'
              - unpackerr_sonarr_queue.json.totalRecords is defined
              - unpackerr_sonarr_anonymous_queue.status == 401
            fail_msg: >-
              Sonarr answered {{ unpackerr_sonarr_status.json | default('nothing') | string | truncate(200) }} to
              the API key and {{ unpackerr_sonarr_anonymous_queue.status }} to an anonymous caller
            success_msg: >-
              Sonarr {{ unpackerr_sonarr_status.json.version }} hands its queue
              ({{ unpackerr_sonarr_queue.json.totalRecords }} items) to the API key, and refuses
              anonymous callers with 401

        # ------------------------------------------------------------------
        # Unpackerr reads Sonarr's queue by its container name, with the key
        # ------------------------------------------------------------------

        # The journal is read scoped to the invocation that is running now, because
        # it also keeps every earlier start of the unit, and a check that accepted
        # those would still pass after the configuration had been changed and the
        # service restarted.
        - name: Ask systemd which invocation of Unpackerr is running
          ansible.builtin.systemd_service:
            name: unpackerr.service
          register: unpackerr_invocation

        # The two services start side by side, so Unpackerr's first poll can
        # find Sonarr not yet listening. It polls again every `UN_INTERVAL`.
        - name: Wait for Unpackerr to read Sonarr's queue (up to 180s)
          ansible.builtin.command:
            cmd: journalctl _SYSTEMD_INVOCATION_ID={{ unpackerr_invocation.status.InvocationID }} --no-pager --output cat
          register: unpackerr_journal
          until: ('[Sonarr] Updated (' ~ unpackerr_molecule_sonarr_url ~ ')') in unpackerr_journal.stdout
          retries: 36
          delay: 5
          changed_when: false
          # So that giving up is reported by the assertion below rather than as
          # a failed command.
          failed_when: false

        # Unpackerr logs this line only after Sonarr returned the queue, and the
        # number in it is the one Sonarr reports first-hand above.
        - name: Assert Unpackerr reads Sonarr's queue with the configuration the role rendered
          ansible.builtin.assert:
            that:
              - >-
                ('=> Sonarr Config: 1 server: ' ~ unpackerr_molecule_sonarr_url ~ ', apikey:true,') in unpackerr_journal.stdout
              - >-
                ('paths:["' ~ unpackerr_molecule_downloads_bind_path ~ '"]') in unpackerr_journal.stdout
              - >-
                ('[Sonarr] Updated (' ~ unpackerr_molecule_sonarr_url ~ '): ' ~ unpackerr_sonarr_queue.json.totalRecords ~ ' Items Queued')
                in unpackerr_journal.stdout
            fail_msg: >-
              Unpackerr did not read Sonarr's queue:
              {{ unpackerr_journal.stdout_lines | select('search', 'Sonarr') | list }}
            success_msg: >-
              Unpackerr reaches Sonarr at {{ unpackerr_molecule_sonarr_url }} and reads the same
              {{ unpackerr_sonarr_queue.json.totalRecords }}-item queue that Sonarr reports first-hand

        # The same image on the same network, pointed at the same Sonarr, but
        # holding a key Sonarr never issued. Sonarr refusing it is what says the
        # success above is the role's key at work, rather than Sonarr letting
        # anything on its network in.
        - name: Read the image the role's Unpackerr container runs
          ansible.builtin.command:
            cmd: docker container inspect --format {% raw %}'{{ .Config.Image }}'{% endraw %} {{ unpackerr_molecule_container }}
          register: unpackerr_running_image
          changed_when: false

        - name: Run the Unpackerr image with a wrong API key on Sonarr's network
          ansible.builtin.command:
            cmd: >-
              docker run -d --rm
              --name {{ unpackerr_verify_wrong_key_container }}
              --network {{ unpackerr_molecule_sonarr_network }}
              --env UN_INTERVAL=15s
              --env UN_SONARR_0_URL={{ unpackerr_molecule_sonarr_url }}
              --env UN_SONARR_0_API_KEY={{ unpackerr_verify_wrong_api_key }}
              {{ unpackerr_running_image.stdout | trim }}
          changed_when: true

        - name: Run the wrong-key control with the control container cleaned up afterwards
          block:
            - name: Wait for Sonarr to turn the wrong key away (up to 3m)
              ansible.builtin.command:
                cmd: "docker logs {{ unpackerr_verify_wrong_key_container }}"
              register: unpackerr_wrong_key_log
              until: "'401' in (unpackerr_wrong_key_log.stdout ~ unpackerr_wrong_key_log.stderr)"
              retries: 36
              delay: 5
              changed_when: false

            - name: Assert Sonarr turns away an Unpackerr without the right key
              ansible.builtin.assert:
                that:
                  - >-
                    ('Sonarr (' ~ unpackerr_molecule_sonarr_url ~ '): api.Get(v3/queue): invalid status code, 401') in unpackerr_wrong_key_log.stdout
                  - "'[Sonarr] Updated' not in unpackerr_wrong_key_log.stdout"
                fail_msg: >-
                  An Unpackerr holding a key Sonarr never issued logged
                  {{ unpackerr_wrong_key_log.stdout_lines | select('search', 'Sonarr') | list }}
                success_msg: >-
                  An Unpackerr holding a key Sonarr never issued is refused with 401, so the queue the
                  role's Unpackerr reads is the role's key at work

          always:
            - name: Remove the wrong-key control
              ansible.builtin.command:
                cmd: "docker rm --force {{ unpackerr_verify_wrong_key_container }}"
              changed_when: true

        # ------------------------------------------------------------------
        # Both see the download directory at the same path
        # ------------------------------------------------------------------

        # Sonarr reports where a download is in its own terms, and Unpackerr
        # looks there in its own filesystem. That only works if both containers
        # see the download directory at the very same path.
        - name: Place a folder into the download directory on the host
          ansible.builtin.file:
            path: "{{ unpackerr_molecule_downloads_path }}/{{ unpackerr_verify_marker_folder }}"
            state: directory
            mode: "0755"
            owner: "{{ unpackerr_uid }}"
            group: "{{ unpackerr_gid }}"

        - name: Ask Sonarr what it sees in the download directory
          ansible.builtin.uri:
            url: "{{ unpackerr_molecule_sonarr_verify_url }}/api/v3/filesystem?path={{ unpackerr_molecule_downloads_bind_path }}/&includeFiles=false"
            headers:
              X-Api-Key: "{{ unpackerr_molecule_sonarr_api_key }}"
            status_code: [200]
          register: unpackerr_sonarr_downloads

        - name: Ask Unpackerr's container whether it sees the same folder at the same path
          ansible.builtin.command:
            cmd: "docker exec {{ unpackerr_molecule_container }} ls -d {{ unpackerr_molecule_downloads_bind_path }}/{{ unpackerr_verify_marker_folder }}"
          register: unpackerr_downloads
          changed_when: false
          failed_when: false

        - name: Assert Sonarr and Unpackerr see the download directory at the same path
          ansible.builtin.assert:
            that:
              - >-
                (unpackerr_molecule_downloads_bind_path ~ '/' ~ unpackerr_verify_marker_folder ~ '/')
                in (unpackerr_sonarr_downloads.json.directories | map(attribute='path') | list)
              - unpackerr_downloads.rc == 0
            fail_msg: >-
              Sonarr lists {{ unpackerr_sonarr_downloads.json.directories | map(attribute='path') | list }}, and
              Unpackerr's container answered "{{ unpackerr_downloads.stdout }}{{ unpackerr_downloads.stderr }}"
            success_msg: >-
              Both Sonarr and Unpackerr see {{ unpackerr_molecule_downloads_path }}/{{ unpackerr_verify_marker_folder }}
              from the host at {{ unpackerr_molecule_downloads_bind_path }}/{{ unpackerr_verify_marker_folder }}

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "unpackerr_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: unpackerr_restarts_before
              loop: "{{ unpackerr_verify_units }}"

            # Comfortably longer than the units' `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: unpackerr_restarts_after
              loop: "{{ unpackerr_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - unpackerr_restarts_after.results | map(attribute='status.NRestarts') | list == unpackerr_restarts_before.results | map(attribute='status.NRestarts') | list
                  - unpackerr_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in unpackerr_verify_units | zip(unpackerr_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in unpackerr_verify_units | zip(unpackerr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in unpackerr_verify_units | zip(unpackerr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Unpackerr Sonarr integration verification summary
          ansible.builtin.debug:
            msg:
              - "systemd: {% for unit, state in unpackerr_verify_units | zip(unpackerr_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Sonarr: {{ unpackerr_sonarr_status.json.version }}, queue {{ unpackerr_sonarr_queue.json.totalRecords }} items, anonymous {{ unpackerr_sonarr_anonymous_queue.status }}"
              - "Unpackerr: {{ unpackerr_journal.stdout_lines | select('search', '\\[Sonarr\\] Updated') | first }}"
              - "Wrong key: {{ unpackerr_wrong_key_log.stdout_lines | select('search', '401') | first }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service logs.
        - name: Retrieve the systemd service logs
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          register: unpackerr_service_logs
          changed_when: false
          loop: "{{ unpackerr_verify_units }}"

        - name: Show the systemd service logs
          ansible.builtin.debug:
            msg: "{{ item.stdout_lines }}"
          loop: "{{ unpackerr_service_logs.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Verification failed. The systemd service logs are printed above."
