---
- name: Install Unpackerr so that there is something to uninstall
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure the download directory with its watched folder exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ unpackerr_uid }}"
        group: "{{ unpackerr_gid }}"
      loop:
        - "{{ unpackerr_molecule_downloads_path }}"
        - "{{ unpackerr_molecule_downloads_path }}/{{ unpackerr_molecule_watch_folder }}"
        - "{{ unpackerr_molecule_downloads_path }}/molecule-staging"

    - name: Include roles for Unpackerr uninstallation Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure Unpackerr service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure Unpackerr systemd service is started
      ansible.builtin.systemd_service:
        name: unpackerr.service
        state: started

    # Unpackerr keeps no state of its own. What it leaves behind is what it
    # extracted into the download directory, which is both the evidence the
    # verification uses that anything was ever installed here at all, and the
    # operator's data that the uninstallation must leave alone.
    #
    # Unpackerr only picks up items that arrive after it has started watching,
    # so the release is moved in once it has.
    - name: Wait for Unpackerr to start watching its folder (up to 3m)
      ansible.builtin.command:
        cmd: journalctl --unit=unpackerr.service --no-pager --output cat
      register: unpackerr_journal
      until: "'[Folder] Watching' in unpackerr_journal.stdout"
      retries: 36
      delay: 5
      changed_when: false

    - name: Pack a release into an archive outside the watched folder
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import os, sys, zipfile

            release_path, uid, gid = sys.argv[1:4]
            release_name = os.path.basename(release_path)
            archive_path = os.path.join(release_path, release_name + '.zip')

            os.makedirs(release_path)
            with zipfile.ZipFile(archive_path, 'w') as archive:
                archive.writestr(release_name + '/episode.mkv', 'packed by molecule\n')

            for path in (release_path, archive_path):
                os.chown(path, int(uid), int(gid))
          - "{{ unpackerr_molecule_downloads_path }}/molecule-staging/{{ unpackerr_molecule_release_name }}"
          - "{{ unpackerr_uid }}"
          - "{{ unpackerr_gid }}"
        creates: "{{ unpackerr_molecule_downloads_path }}/{{ unpackerr_molecule_watch_folder }}/{{ unpackerr_molecule_release_name }}"

    - name: Move the finished release into the watched folder
      ansible.builtin.command:
        argv:
          - mv
          - "{{ unpackerr_molecule_downloads_path }}/molecule-staging/{{ unpackerr_molecule_release_name }}"
          - "{{ unpackerr_molecule_downloads_path }}/{{ unpackerr_molecule_watch_folder }}/"
        creates: "{{ unpackerr_molecule_downloads_path }}/{{ unpackerr_molecule_watch_folder }}/{{ unpackerr_molecule_release_name }}"

    - name: Wait for Unpackerr to extract the release (up to 3m)
      ansible.builtin.stat:
        path: "{{ unpackerr_molecule_extracted_payload_path }}"
      register: unpackerr_extracted_payload
      until: unpackerr_extracted_payload.stat.exists
      retries: 36
      delay: 5
