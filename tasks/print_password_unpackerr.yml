---
- name: Find the Unpackerr temporary password in the service log
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      journalctl -u {{ unpackerr_identifier }} --no-pager --output=cat | grep -- 'Generated temporary UI password for user' | tail -n 1
    executable: /bin/bash
  register: unpackerr_temporary_password_log
  changed_when: false
  # grep exits with 1 when it finds nothing, which the task below reports
  failed_when: unpackerr_temporary_password_log.rc not in [0, 1]

- name: Extract the Unpackerr temporary password
  ansible.builtin.set_fact:
    unpackerr_temporary_password: >-
      {{ unpackerr_temporary_password_log.stdout | regex_search('Generated temporary UI password for user \S+: ([A-Za-z0-9_-]+)', '\1') | default([], true) | first | default('') }}

- name: Fail if no Unpackerr temporary password was found
  ansible.builtin.fail:
    msg: >-
      No temporary password found in the {{ unpackerr_identifier }} service log.
      Unpackerr logs it only once, on its first start, so it may have rotated out of the journal.
      It does not generate one when `unpackerr_environment_variables_un_webserver_ui_password` is set.
  when: unpackerr_temporary_password == ""

- name: Print the Unpackerr temporary password
  ansible.builtin.debug:
    msg: "Log in to Unpackerr as `admin` with the temporary password: {{ unpackerr_temporary_password }}"
